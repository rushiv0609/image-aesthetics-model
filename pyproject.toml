[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "image-aesthetics-model"
version = "0.1.0"
description = "Local AVA/SigLIP2 aesthetic-model training and cache tooling"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "Pillow>=10.0",
  "tqdm>=4.65",
]

[project.optional-dependencies]
mlx = ["mlx>=0.20", "transformers>=4.45", "torch>=2.2"]
safetensors = ["safetensors>=0.4"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
